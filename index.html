<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>機械日常点検システム</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  background: #f3f5f7;
  color: #20252b;
}

header {
  background: #173f35;
  color: white;
  padding: 16px;
}

h1 {
  font-size: 1.25rem;
  margin: 0 0 6px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 12px;
}

section {
  background: white;
  border-radius: 12px;
  padding: 14px;
  margin: 12px 0;
  box-shadow: 0 1px 5px #0001;
}

label {
  font-weight: 650;
  display: block;
  margin-bottom: 6px;
}

input, select, textarea, button {
  font: inherit;
}

input, select, textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #bbc5c8;
  border-radius: 8px;
  background: white;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px 14px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #176b52;
  color: white;
}

.secondary {
  background: #e5ece9;
  color: #183b31;
}

.danger {
  background: #fbe9e7;
  color: #8c251b;
}

.item {
  border: 1px solid #d9e1df;
  border-radius: 10px;
  padding: 12px;
  margin: 10px 0;
}

.column-bulk {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}

.column-bulk button {
  background: #d9f3e5;
  border: 2px solid #16834f;
  color: #145c39;
  padding: 10px 5px;
}

.checks {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.period {
  background: #f7f9f8;
  padding: 8px;
  border-radius: 8px;
}

.choices {
  display: flex;
  gap: 5px;
}

.choice {
  flex: 1;
  padding: 12px 2px;
  border: 2px solid #d0d9d6;
  background: white;
  color: #26332e;
  font-size: 1.1rem;
}

.choice.active.ok {
  background: #d9f3e5;
  border-color: #16834f;
}

.choice.active.mid {
  background: #fff0c2;
  border-color: #c78b00;
}

.choice.active.ng {
  background: #ffe0de;
  border-color: #c33d32;
}

.sticky {
  position: sticky;
  bottom: 0;
  background: #ffffffed;
  padding: 10px;
  border-top: 1px solid #d5ddda;
  display: flex;
  gap: 8px;
}

.sticky button {
  flex: 1;
}

@media (max-width: 600px) {
  main {
    padding: 8px;
  }

  section {
    padding: 11px;
  }

  .checks {
    gap: 5px;
  }

  .choice {
    padding: 13px 1px;
    font-size: 1rem;
  }
}
</style>
</head>

<body>
<header>
  <h1>機械日常点検システム</h1>
  <p>スライス加工室・ホルモン加工室　機械日常点検表</p>
</header>

<main>
  <section>
    <h2>日付・作業者登録</h2>

    <label for="date">点検日</label>
    <input id="date" type="date">

    <label for="newWorker">作業者を登録</label>
    <input id="newWorker" placeholder="名前を入力">

    <button class="secondary" id="addWorker">
      名前を登録
    </button>

    <div id="workers"></div>
  </section>

  <section>
    <h2>点検項目</h2>

    <div class="column-bulk">
      <button type="button" data-period="start">
        始業前を全部〇
      </button>

      <button type="button" data-period="restart">
        再開時を全部〇
      </button>

      <button type="button" data-period="end">
        終了時を全部〇
      </button>
    </div>

    <div id="checklist"></div>
  </section>

  <section>
    <label for="notes">特記事項</label>
    <textarea id="notes" rows="3"></textarea>
  </section>

  <section>
    <button class="primary" id="export" style="width:100%">
      Excel出力（元の点検表レイアウト）
    </button>
  </section>
</main>

<div class="sticky">
  <button class="secondary" id="save">入力を保存</button>
  <button class="danger" id="clear">点検結果をリセット</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

</script>
</body>
</html>
